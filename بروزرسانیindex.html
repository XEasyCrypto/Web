<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XEasyCrypto | در حال به‌روزرسانی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap');
        
        :root {
            --bg-base: #060608;
            --aura-1: #1e40af; 
            --aura-2: #6b21a8;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .aura-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        .aura {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: moveAura 15s infinite alternate ease-in-out;
        }

        .aura-1 { width: 400px; height: 400px; background: var(--aura-1); top: 10%; left: 10%; }
        .aura-2 { width: 500px; height: 500px; background: var(--aura-2); bottom: 10%; right: 10%; animation-delay: -5s; }

        @keyframes moveAura {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        .maintenance-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 40px 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gear-icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            margin-left: 8px;
            box-shadow: 0 0 10px #3b82f6;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="aura-layer">
        <div class="aura aura-1"></div>
        <div class="aura aura-2"></div>
    </div>

    <div class="maintenance-card">
        <div class="gear-icon">⚙️</div>
        <h1 class="text-2xl font-black mb-4 tracking-tight">سایت در حال تعمیر است</h1>
        <p class="text-[14px] opacity-60 leading-7 mb-8 font-light">
            ما در حال ارتقای سیستم برای ارائه خدمات بهتر به شما هستیم. لطفاً دقایقی دیگر دوباره مراجعه کنید.
        </p>
        
        <div class="inline-flex items-center px-4 py-2 bg-[rgba(255,255,255,0.05)] rounded-full border border-[var(--card-border)]">
            <span class="status-dot"></span>
            <span class="text-[11px] font-bold opacity-80 uppercase tracking-widest">Updating System...</span>
        </div>
    </div>

</body>
</html>
